# ========== 镜像源 ==========
[source.crates-io]
replace-with = 'aliyun'

[source.aliyun]
registry = "sparse+https://mirrors.aliyun.com/crates.io-index/"

# ========== 网络与下载优化 ==========
[net]
retry = 3                            # 下载失败自动重试次数
git-fetch-with-cli = true            # 使用系统 git 克隆（可充分利用 git 的代理/镜像配置）
# 若需要配合 ghproxy 加速 GitHub 依赖，可在 git 全局配置中设置：
# git config --global url."https://ghproxy.com/https://github.com/".insteadOf "https://github.com/"

[http]
multiplexing = true                  # 启用 HTTP/2 多路复用（默认开启）
low-speed-limit = 10240              # 低于 10KB/s 视为慢速，超时会重试（单位：字节/秒）
timeout = 30                         # 网络超时时间（秒）
# 如果使用代理（例如 Clash/VPN），取消下面注释并改为实际地址：
# proxy = "socks5://127.0.0.1:1080"

# ========== 编译构建 ==========
[build]
# 增量编译（默认已开启，明确保留可避免意外关闭）
incremental = true
# 共享编译产物目录，避免在多项目间重复编译相同依赖：
# target-dir = "/tmp/.cargo/target-cache"
# 使用 sccache 缓存编译结果（需先安装 sccache 并配置）：
# rustc-wrapper = "sccache"

# ========== 各平台 target 配置 ==========

# --- Linux x86_64 ---
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=mold",
    "-C", "link-arg=-Wl,--compress-debug-sections=zlib",
]

# --- Linux x86_64 musl（静态链接）---
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

# --- Linux ARM64 ---
[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=mold",
]

# --- macOS Intel ---
[target.x86_64-apple-darwin]
linker = "clang"
rustflags = [
    "-C", "link-arg=-Wl,-headerpad_max_install_names",
]

# --- macOS Apple Silicon ---
[target.aarch64-apple-darwin]
linker = "clang"
rustflags = [
    "-C", "link-arg=-Wl,-headerpad_max_install_names",
]

# --- Windows MSVC ---
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
