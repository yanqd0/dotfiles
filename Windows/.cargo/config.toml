# ========== 镜像源 ==========
# 修改 replace-with 即可切换。每个源下方注释对应 rustup 环境变量配置。

[source.crates-io]
replace-with = 'aliyun'

[source.aliyun]
# --- 阿里云（推荐：延迟低、带宽大）---
# rustup: RUSTUP_DIST_SERVER="https://mirrors.aliyun.com/rustup"
#         RUSTUP_UPDATE_ROOT="https://mirrors.aliyun.com/rustup/rustup"
registry = "sparse+https://mirrors.aliyun.com/crates.io-index/"

[source.rsproxy]
# --- 字节跳动 RsProxy（每分钟同步，速度最快）---
# rustup: RUSTUP_DIST_SERVER="https://rsproxy.cn"
#         RUSTUP_UPDATE_ROOT="https://rsproxy.cn/rustup"
registry = "sparse+https://rsproxy.cn/index/"

[source.ustc]
# --- 中国科学技术大学（教育网友好，稳定性高）---
# rustup: RUSTUP_DIST_SERVER="https://mirrors.ustc.edu.cn/rust-static"
#         RUSTUP_UPDATE_ROOT="https://mirrors.ustc.edu.cn/rust-static/rustup"
registry = "sparse+https://mirrors.ustc.edu.cn/crates.io-index/"

[source.tuna]
# --- 清华大学 TUNA（教育网首选）---
# rustup: RUSTUP_DIST_SERVER="https://mirrors.tuna.tsinghua.edu.cn/rustup"
#         RUSTUP_UPDATE_ROOT="https://mirrors.tuna.tsinghua.edu.cn/rustup/rustup"
registry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"

[source.sjtug]
# --- 上海交通大学（华东地区延迟低）---
# rustup: RUSTUP_DIST_SERVER="https://mirrors.sjtug.sjtu.edu.cn/rust-static/"
#         RUSTUP_UPDATE_ROOT="https://mirrors.sjtug.sjtu.edu.cn/rust-static/rustup"
registry = "sparse+https://mirrors.sjtug.sjtu.edu.cn/crates.io-index/"

[source.huawei]
# --- 华为云（企业级可靠性）---
# rustup: RUSTUP_DIST_SERVER https://mirrors.huaweicloud.com/rustup/
#         RUSTUP_UPDATE_ROOT https://mirrors.huaweicloud.com/rustup/rustup/
registry = "sparse+https://repo.huaweicloud.com/rustup/crates.io-index/"

# ========== 网络与下载优化 ==========
[net]
retry = 3                            # 下载失败自动重试次数
git-fetch-with-cli = true            # 使用系统 git 克隆（可充分利用 git 的代理/镜像配置）
# 若需要配合 ghproxy 加速 GitHub 依赖，可在 git 全局配置中设置：
# git config --global url."https://ghproxy.com/https://github.com/".insteadOf "https://github.com/"

[http]
multiplexing = true                  # 启用 HTTP/2 多路复用（默认开启）
low-speed-limit = 10240              # 低于 10KB/s 视为慢速，超时会重试（单位：字节/秒）
timeout = 30                         # 网络超时时间（秒）
# 如果使用代理（例如 Clash/VPN），取消下面注释并改为实际地址：
# proxy = "socks5://127.0.0.1:1080"

# ========== 编译构建 ==========
[build]
# 增量编译（默认已开启，明确保留可避免意外关闭）
incremental = true
# 共享编译产物目录，避免在多项目间重复编译相同依赖：
# target-dir = "/tmp/.cargo/target-cache"
# 使用 sccache 缓存编译结果（需先安装 sccache 并配置）：
# rustc-wrapper = "sccache"

# ========== 各平台 target 配置 ==========

# --- Linux x86_64 ---
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=mold",
    "-C", "link-arg=-Wl,--compress-debug-sections=zlib",
]

# --- Linux x86_64 musl（静态链接）---
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

# --- Linux ARM64 ---
[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=mold",
]

# --- macOS Intel ---
[target.x86_64-apple-darwin]
linker = "clang"
rustflags = [
    "-C", "link-arg=-Wl,-headerpad_max_install_names",
]

# --- macOS Apple Silicon ---
[target.aarch64-apple-darwin]
linker = "clang"
rustflags = [
    "-C", "link-arg=-Wl,-headerpad_max_install_names",
]

# --- Windows MSVC ---
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
