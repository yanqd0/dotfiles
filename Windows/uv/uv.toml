# PyPI 包索引源，设为国内镜像可大幅加速包下载。
# 当前: 阿里云
#   阿里云: https://mirrors.aliyun.com/pypi/simple/
# 备选:
#   清华:   https://pypi.tuna.tsinghua.edu.cn/simple
#   中科大: https://pypi.mirrors.ustc.edu.cn/simple/
#   豆瓣:   https://pypi.douban.com/simple/
#   华为云: https://repo.huaweicloud.com/repository/pypi/simple
#   腾讯云: https://mirrors.cloud.tencent.com/pypi/simple
index-url = "https://mirrors.aliyun.com/pypi/simple/"

# 安装后编译 .pyc 字节码，提升模块导入速度，略增安装耗时。
# 可选值: true | false
compile-bytecode = true

# 使用系统原生 TLS 库（OpenSSL/Schannel/Security.framework）替代 rustls，
# 可避免部分企业防火墙或代理环境下的证书兼容问题。
# 可选值: true | false
native-tls = true

# 虚拟环境中包的链接方式。hardlink 快且几乎不占额外磁盘，
# cache clean 只删缓存侧引用，不影响已装环境（symlink 则会悬空，官方不推荐）。
# 跨文件系统场景（如 WSL /mnt/c、Docker cache mount）hardlink 不可用时 uv 会警告并回退，
# 可在该环境用 UV_LINK_MODE=copy 局部覆盖，无需全局写死。
# 可选值: clone | copy | hardlink | symlink
link-mode = "hardlink"

# Python 解释器下载镜像，uv python install 时从该地址拉取。
# 当前: npmmirror（阿里）
#   npmmirror: https://registry.npmmirror.com/-/binary/python-build-standalone/
# 备选:
#   南大:      https://mirror.nju.edu.cn/github-release/astral-sh/python-build-standalone/
#   中科大:    https://mirrors.ustc.edu.cn/github-release/astral-sh/python-build-standalone/
python-install-mirror = "https://registry.npmmirror.com/-/binary/python-build-standalone/"

# 并发下载数，国内源带宽通常充足，默认值 50 一般无需调低。
# 可选值: 正整数，默认 50
concurrent-downloads = 50
