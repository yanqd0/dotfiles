# pip 配置文件（Windows 对应 %APPDATA%\pip\pip.ini）

[global]
# PyPI 包索引源。
# 当前: 阿里云
#   阿里云: https://mirrors.aliyun.com/pypi/simple/
# 备选:
#   清华:   https://pypi.tuna.tsinghua.edu.cn/simple
#   中科大: https://pypi.mirrors.ustc.edu.cn/simple/
#   豆瓣:   https://pypi.douban.com/simple/
#   华为云: https://repo.huaweicloud.com/repository/pypi/simple
#   腾讯云: https://mirrors.cloud.tencent.com/pypi/simple
index-url = https://mirrors.aliyun.com/pypi/simple/

# 网络请求超时（秒），避免慢速连接无限等待。
# 可选值: 正整数
default-timeout = 60

# 是否禁用包缓存。false 表示启用缓存，加速重复安装。
# 可选值: true | false
no-cache-dir = false

# 禁用 pip 自身的版本检查，减少网络请求。
# 可选值: true | false
disable-pip-version-check = true

[install]
# 是否以用户模式安装（--user）。false 表示装到全局/虚拟环境。
# 可选值: true | false
user = false

[freeze]
# pip freeze 时的网络超时（秒）。
# 可选值: 正整数
timeout = 10

[list]
# pip list 输出格式。columns 并列显示，适合终端；legacy 或 freeze 适合管道。
# 可选值: columns | legacy | freeze | json
format = columns
